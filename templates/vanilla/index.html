<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Turso Pages Guestbook</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="title-badge">
        <span id="status-dot" class="status-dot"></span>
        <span id="status-text">Checking API...</span>
      </div>
      <h1>Turso Pages Starter</h1>
      <p class="subtitle">A full-stack, 100% free web app powered by GitHub Pages, Cloudflare Workers & Turso DB.</p>
    </header>

    <main>
      <section class="card">
        <div id="error-box" class="alert alert-error" style="display: none;"></div>
        
        <form id="post-form">
          <div class="form-group">
            <label for="name-input">
              <span>Your Name / Handle</span>
            </label>
            <input type="text" id="name-input" placeholder="e.g. Satoshi" maxlength="50" required>
          </div>

          <div class="form-group">
            <label for="message-input">
              <span>Message</span>
              <span id="message-counter" class="char-counter">0 / 500</span>
            </label>
            <textarea id="message-input" placeholder="Leave a message in the Turso-backed guestbook..." maxlength="500" required></textarea>
          </div>

          <button type="submit" id="submit-btn" class="btn">
            Sign Guestbook
          </button>
        </form>
      </section>

      <section>
        <div class="feed-header">
          <h2>Recent Messages</h2>
        </div>
        <div id="posts-container" class="posts-list">
          <div class="empty-state">
            <p>Loading entries from Turso...</p>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <p>
        Built with <a href="https://pages.github.com/" target="_blank" rel="noopener">GitHub Pages</a> + 
        <a href="https://workers.cloudflare.com/" target="_blank" rel="noopener">Cloudflare Workers</a> + 
        <a href="https://turso.tech/" target="_blank" rel="noopener">Turso</a>.
      </p>
    </footer>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
